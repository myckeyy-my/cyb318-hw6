<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Rush</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>APEX RUSH</h1>
      <p id="track-name">Loading circuit…</p>
    </header>
    <div id="stage">
      <canvas id="game" tabindex="0" aria-label="Apex Rush test circuit"></canvas>
      <div id="hud">
        <span id="speed">0 km/h</span>
      </div>
    </div>
    <p id="error" hidden></p>
    <footer>
      <p>Left and Right steer. Space accelerates. D brakes.</p>
      <p>Square test circuit</p>
    </footer>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
